<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>하우스푸어</title>
<meta name="description" content="하우스푸어 - 픽셀 도트 감성 내 집 마련 가계부 PWA">
<meta name="theme-color" content="#ffe9a3">
<link rel="manifest" href="manifest.webmanifest?v=46">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="alternate icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="하우스푸어">
<link rel="stylesheet" href="css/style.css?v=46">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <img class="brandico" src="icons/logo.svg?v=46" alt="" width="24" height="24">
      <span>하우스푸어</span>
    </div>
    <div class="row" style="gap:6px">
      <button class="icon-btn" id="syncBtn" title="동기화" aria-label="동기화">⇅</button>
      <button class="icon-btn" id="themeBtn" title="테마 전환" aria-label="테마 전환">☾</button>
    </div>
  </header>

  <div class="ptr" id="ptr" aria-hidden="true"><span class="ico">↓</span><span class="txt">당겨서 새로고침</span></div>

  <nav class="rail" id="rail"></nav>

  <main id="view" class="view"></main>

  <button class="fab" id="fab" aria-label="내역 추가">+</button>

  <nav class="tabbar" id="tabbar"></nav>
</div>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet-dim" data-close="1"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="js/sprites.js?v=46"></script>
<script src="js/pixel.js?v=46"></script>
<script src="js/store.js?v=46"></script>
<script src="js/calc.js?v=46"></script>
<script src="js/sync.js?v=46"></script>
<script src="js/qrcode.min.js?v=46"></script>
<script src="js/ui.js?v=46"></script>
<script src="js/app.js?v=46"></script>
</body>
</html>
